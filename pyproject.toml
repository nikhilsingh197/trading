[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_crypto_trader"
version = "0.1.0"
description = "Production-grade AI cryptocurrency trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PROPRIETARY" }

dependencies = [
    # ── Core ──────────────────────────────────────────────────
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<25",

    # ── Database ──────────────────────────────────────────────
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",

    # ── Cache / Queue ─────────────────────────────────────────
    "redis>=5.0,<6",
    "celery[redis]>=5.3,<6",

    # ── API ───────────────────────────────────────────────────
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "websockets>=12.0,<14",
    "httpx>=0.27,<1",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",

    # ── Exchange ──────────────────────────────────────────────
    "ccxt>=4.3,<5",

    # ── Data / Numerics ───────────────────────────────────────
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",

    # ── Technical Indicators ──────────────────────────────────
    "pandas-ta>=0.3.14b0",

    # ── ML ────────────────────────────────────────────────────
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<3",
    "lightgbm>=4.3,<5",
    "hmmlearn>=0.3,<1",

    # ── Deep Learning (optional – heavy) ─────────────────────
    "torch>=2.2,<3",

    # ── Crypto / Security ─────────────────────────────────────
    "cryptography>=42.0,<43",

    # ── Alerts ────────────────────────────────────────────────
    "python-telegram-bot>=20.7,<21",
    "aiosmtplib>=3.0,<4",

    # ── Reporting ─────────────────────────────────────────────
    "jinja2>=3.1,<4",
    "matplotlib>=3.8,<4",
    "plotly>=5.20,<6",

    # ── Scheduling ────────────────────────────────────────────
    "apscheduler>=3.10,<4",

    # ── Utilities ─────────────────────────────────────────────
    "tenacity>=8.2,<10",
    "click>=8.1,<9",
    "rich>=13.7,<14",
    "pyarrow>=15.0,<20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "factory-boy>=3.3,<4",
    "freezegun>=1.4,<2",
    "black>=24.3,<25",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
]

[project.scripts]
act = "ai_crypto_trader.main.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_crypto_trader*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
